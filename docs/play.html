<!DOCTYPE html><html lang="ja" class="no-js"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>参謀の渦 — 流体で遊ぶ</title>
<style>
:root{--bg:#0b0f14;--fg:#e6edf4;--teal:#5fd7c8;--gold:#e3b366;--line:#202b3a;--dim:#8698a9}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
body{font-family:system-ui,'Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif;color:var(--fg);
-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;touch-action:none;cursor:crosshair}
.ov{position:fixed;z-index:2;pointer-events:none}
.top{top:0;left:0;right:0;padding:16px 18px;
background:linear-gradient(180deg,rgba(11,15,20,.72),rgba(11,15,20,0))}
h1{margin:0;font-size:clamp(16px,4.4vw,20px);letter-spacing:.12em;color:var(--teal);font-weight:700;
text-shadow:0 0 20px rgba(95,215,200,.45)}
.sub{color:var(--dim);font-size:12.5px;margin-top:4px;letter-spacing:.04em}
.nav{display:flex;gap:9px;margin-top:11px;flex-wrap:wrap;pointer-events:auto}
.nav a{color:var(--gold);border:1px solid var(--line);border-radius:20px;padding:6px 13px;
font-size:13px;text-decoration:none;background:rgba(11,15,20,.5);backdrop-filter:blur(6px);
transition:color .15s,border-color .15s}
.nav a:hover{color:var(--teal);border-color:#2b4a58}
.ctl{left:0;right:0;bottom:0;padding:16px 18px calc(16px + env(safe-area-inset-bottom));
display:flex;gap:9px;flex-wrap:wrap;align-items:center;justify-content:center;
background:linear-gradient(0deg,rgba(11,15,20,.72),rgba(11,15,20,0))}
.btn{pointer-events:auto;font:inherit;font-size:13.5px;color:#04121a;font-weight:700;border:0;
border-radius:20px;padding:9px 16px;cursor:pointer;background:linear-gradient(180deg,#7fe6d8,#41b6a7);
box-shadow:0 3px 14px rgba(95,215,200,.3);transition:filter .15s,transform .1s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(1px)}
.btn.ghost{color:var(--gold);background:rgba(11,15,20,.5);border:1px solid var(--line);box-shadow:none;
backdrop-filter:blur(6px)}
.btn.ghost:hover{color:var(--teal);border-color:#2b4a58}
.hint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:1;pointer-events:none;
color:var(--dim);font-size:15px;letter-spacing:.06em;text-align:center;line-height:2;
opacity:1;transition:opacity .8s ease}
.hint.gone{opacity:0}
.err{position:fixed;inset:0;z-index:3;display:none;align-items:center;justify-content:center;padding:30px;
text-align:center;color:var(--dim);font-size:15px;line-height:1.9}
</style></head>
<body>
<canvas id="c"></canvas>
<div class="hint" id="hint">指でなぞる — 流れが生まれる<br>タップで、弾ける</div>
<div class="ov top">
  <h1>◇ 参謀の渦</h1>
  <div class="sub">指の動きが速度場になり、本物の流体方程式で渦を巻く。GPUで毎フレーム計算・全部この画面の中だけ。</div>
  <nav class="nav">
    <a href="index.html">← ブリーフィング</a>
    <a href="records.html">記録</a>
    <a href="hunches.html">勘</a>
    <a href="threads.html">記憶の物語</a>
  </nav>
</div>
<div class="ov ctl">
  <button class="btn" id="burst">渦を放つ</button>
  <button class="btn ghost" id="reset">リセット</button>
  <button class="btn ghost" id="save">画を保存</button>
</div>
<div class="err" id="err">この端末のブラウザは WebGL2 に対応していないため、この流体プレイグラウンドを表示できません。<br>最新の Chrome / Safari / Edge でお試しください。</div>

<script>
"use strict";
document.documentElement.className="js";

var canvas=document.getElementById("c");
var gl=canvas.getContext("webgl2",{alpha:false,depth:false,stencil:false,antialias:false,preserveDrawingBuffer:true});
if(!gl){document.getElementById("err").style.display="flex";throw new Error("no webgl2");}
var halfFloat=gl.getExtension("EXT_color_buffer_float");
if(!halfFloat){document.getElementById("err").style.display="flex";
  document.getElementById("err").textContent="この端末では浮動小数点テクスチャ(EXT_color_buffer_float)が使えないため表示できません。";
  throw new Error("no color_buffer_float");}
gl.getExtension("OES_texture_float_linear");

/* ---------- 設定 ---------- */
var SIM_RES=128, DYE_RES=1024;
var DENSITY_DISSIPATION=0.985, VELOCITY_DISSIPATION=0.997, PRESSURE=0.8, PRESSURE_ITER=20, CURL=32;
var SPLAT_RADIUS=0.22, SPLAT_FORCE=6200;
var DPR=Math.min(devicePixelRatio||1,2);

/* ---------- シェーダ ---------- */
function compile(type,src){var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.warn(gl.getShaderInfoLog(s),src);return s;}
function link(vs,fs){var p=gl.createProgram();gl.attachShader(p,vs);gl.attachShader(p,fs);gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))console.warn(gl.getProgramInfoLog(p));return p;}
function uniforms(p){var u={},n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);
  for(var i=0;i<n;i++){var nm=gl.getActiveUniform(p,i).name;u[nm]=gl.getUniformLocation(p,nm);}return u;}

var baseVert=compile(gl.VERTEX_SHADER,`#version 300 es
precision highp float;
in vec2 aPosition;
out vec2 vUv; out vec2 vL; out vec2 vR; out vec2 vT; out vec2 vB;
uniform vec2 texelSize;
void main(){
  vUv=aPosition*0.5+0.5;
  vL=vUv-vec2(texelSize.x,0.0);
  vR=vUv+vec2(texelSize.x,0.0);
  vT=vUv+vec2(0.0,texelSize.y);
  vB=vUv-vec2(0.0,texelSize.y);
  gl_Position=vec4(aPosition,0.0,1.0);
}`);

function frag(src){return compile(gl.FRAGMENT_SHADER,"#version 300 es\nprecision highp float;\nprecision highp sampler2D;\n"+src);}
function prog(fs){var p=link(baseVert,fs);return {program:p,uniforms:uniforms(p)};}

var clearProg=prog(frag(`in vec2 vUv;uniform sampler2D uTexture;uniform float value;out vec4 o;
void main(){o=value*texture(uTexture,vUv);}`));

var splatProg=prog(frag(`in vec2 vUv;uniform sampler2D uTarget;uniform float aspectRatio;
uniform vec3 color;uniform vec2 point;uniform float radius;out vec4 o;
void main(){vec2 p=vUv-point.xy;p.x*=aspectRatio;
vec3 splat=exp(-dot(p,p)/radius)*color;
vec3 base=texture(uTarget,vUv).xyz;o=vec4(base+splat,1.0);}`));

var advectProg=prog(frag(`in vec2 vUv;uniform sampler2D uVelocity;uniform sampler2D uSource;
uniform vec2 texelSize;uniform float dt;uniform float dissipation;out vec4 o;
void main(){vec2 coord=vUv-dt*texture(uVelocity,vUv).xy*texelSize;
o=dissipation*texture(uSource,coord);o.a=1.0;}`));

var divergenceProg=prog(frag(`in vec2 vUv,vL,vR,vT,vB;uniform sampler2D uVelocity;out vec4 o;
void main(){
float L=texture(uVelocity,vL).x;float R=texture(uVelocity,vR).x;
float T=texture(uVelocity,vT).y;float B=texture(uVelocity,vB).y;
vec2 C=texture(uVelocity,vUv).xy;
if(vL.x<0.0){L=-C.x;} if(vR.x>1.0){R=-C.x;} if(vT.y>1.0){T=-C.y;} if(vB.y<0.0){B=-C.y;}
float div=0.5*(R-L+T-B);o=vec4(div,0.0,0.0,1.0);}`));

var curlProg=prog(frag(`in vec2 vL,vR,vT,vB;uniform sampler2D uVelocity;out vec4 o;
void main(){
float L=texture(uVelocity,vL).y;float R=texture(uVelocity,vR).y;
float T=texture(uVelocity,vT).x;float B=texture(uVelocity,vB).x;
float vort=R-L-T+B;o=vec4(0.5*vort,0.0,0.0,1.0);}`));

var vorticityProg=prog(frag(`in vec2 vUv,vL,vR,vT,vB;uniform sampler2D uVelocity;uniform sampler2D uCurl;
uniform float curl;uniform float dt;out vec4 o;
void main(){
float L=texture(uCurl,vL).x;float R=texture(uCurl,vR).x;
float T=texture(uCurl,vT).x;float B=texture(uCurl,vB).x;
float C=texture(uCurl,vUv).x;
vec2 force=0.5*vec2(abs(T)-abs(B),abs(R)-abs(L));
force/=length(force)+0.0001;force*=curl*C;force.y*=-1.0;
vec2 vel=texture(uVelocity,vUv).xy;vel+=force*dt;
vel=clamp(vel,-1000.0,1000.0);o=vec4(vel,0.0,1.0);}`));

var pressureProg=prog(frag(`in vec2 vUv,vL,vR,vT,vB;uniform sampler2D uPressure;uniform sampler2D uDivergence;out vec4 o;
void main(){
float L=texture(uPressure,vL).x;float R=texture(uPressure,vR).x;
float T=texture(uPressure,vT).x;float B=texture(uPressure,vB).x;
float div=texture(uDivergence,vUv).x;
float p=(L+R+B+T-div)*0.25;o=vec4(p,0.0,0.0,1.0);}`));

var gradientProg=prog(frag(`in vec2 vUv,vL,vR,vT,vB;uniform sampler2D uPressure;uniform sampler2D uVelocity;out vec4 o;
void main(){
float L=texture(uPressure,vL).x;float R=texture(uPressure,vR).x;
float T=texture(uPressure,vT).x;float B=texture(uPressure,vB).x;
vec2 vel=texture(uVelocity,vUv).xy;vel-=vec2(R-L,T-B);o=vec4(vel,0.0,1.0);}`));

var displayProg=prog(frag(`in vec2 vUv;uniform sampler2D uTexture;out vec4 o;
void main(){
vec3 c=texture(uTexture,vUv).rgb;
float a=max(c.r,max(c.g,c.b));
// ダーク地に発光を乗せ、わずかにトーン。arを陰影に使い立体感を出す。
c=c/(0.6+0.7*a);
vec3 bg=vec3(0.043,0.059,0.078);
o=vec4(bg*(1.0-min(a,1.0))+c,1.0);}`));

/* ---------- 全画面 blit ---------- */
var quad=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,quad);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,-1,1,1,1,1,-1]),gl.STATIC_DRAW);
var idx=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,idx);
gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array([0,1,2,0,2,3]),gl.STATIC_DRAW);
gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);gl.enableVertexAttribArray(0);
function blit(target){
  if(target==null){gl.viewport(0,0,gl.drawingBufferWidth,gl.drawingBufferHeight);gl.bindFramebuffer(gl.FRAMEBUFFER,null);}
  else{gl.viewport(0,0,target.width,target.height);gl.bindFramebuffer(gl.FRAMEBUFFER,target.fbo);}
  gl.drawElements(gl.TRIANGLES,6,gl.UNSIGNED_SHORT,0);
}

/* ---------- FBO ---------- */
function createFBO(w,h,internal,format,type,param){
  gl.activeTexture(gl.TEXTURE0);
  var tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,param);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,param);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D,0,internal,w,h,0,format,type,null);
  var fbo=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
  gl.viewport(0,0,w,h);gl.clear(gl.COLOR_BUFFER_BIT);
  return {texture:tex,fbo:fbo,width:w,height:h,texelX:1/w,texelY:1/h,
    attach:function(id){gl.activeTexture(gl.TEXTURE0+id);gl.bindTexture(gl.TEXTURE_2D,tex);return id;}};
}
function createDouble(w,h,internal,format,type,param){
  var a=createFBO(w,h,internal,format,type,param),b=createFBO(w,h,internal,format,type,param);
  return {width:w,height:h,texelX:1/w,texelY:1/h,
    get read(){return a;},set read(v){a=v;},get write(){return b;},set write(v){b=v;},
    swap:function(){var t=a;a=b;b=t;}};
}

var RG_I=gl.RG16F, RG_F=gl.RG, RGBA_I=gl.RGBA16F, RGBA_F=gl.RGBA, HF=gl.HALF_FLOAT, R_I=gl.R16F, R_F=gl.RED;
var LIN=gl.LINEAR;
var dye,velocity,divergence,curl,pressure;
function initFBOs(){
  var sw=SIM_RES, sh=Math.round(SIM_RES*(canvas.height/canvas.width));
  var dw=DYE_RES, dh=Math.round(DYE_RES*(canvas.height/canvas.width));
  if(canvas.height>canvas.width){
    sh=SIM_RES; sw=Math.round(SIM_RES*(canvas.width/canvas.height));
    dh=DYE_RES; dw=Math.round(DYE_RES*(canvas.width/canvas.height));
  }
  sw=Math.max(2,sw);sh=Math.max(2,sh);dw=Math.max(2,dw);dh=Math.max(2,dh);
  dye=createDouble(dw,dh,RGBA_I,RGBA_F,HF,LIN);
  velocity=createDouble(sw,sh,RG_I,RG_F,HF,LIN);
  divergence=createFBO(sw,sh,R_I,R_F,HF,gl.NEAREST);
  curl=createFBO(sw,sh,R_I,R_F,HF,gl.NEAREST);
  pressure=createDouble(sw,sh,R_I,R_F,HF,gl.NEAREST);
}

function resize(){
  var w=Math.floor(innerWidth*DPR), h=Math.floor(innerHeight*DPR);
  if(canvas.width!==w||canvas.height!==h){
    canvas.width=w;canvas.height=h;canvas.style.width=innerWidth+"px";canvas.style.height=innerHeight+"px";
    initFBOs();
  }
}

/* ---------- ステップ ---------- */
function bindV(u,tex,id){gl.uniform1i(u,tex.attach(id));}
function step(dt){
  gl.disable(gl.BLEND);
  // curl
  gl.useProgram(curlProg.program);
  gl.uniform2f(curlProg.uniforms.texelSize,velocity.texelX,velocity.texelY);
  bindV(curlProg.uniforms.uVelocity,velocity.read,0);
  blit(curl);
  // vorticity
  gl.useProgram(vorticityProg.program);
  gl.uniform2f(vorticityProg.uniforms.texelSize,velocity.texelX,velocity.texelY);
  bindV(vorticityProg.uniforms.uVelocity,velocity.read,0);
  gl.uniform1i(vorticityProg.uniforms.uCurl,curl.attach(1));
  gl.uniform1f(vorticityProg.uniforms.curl,CURL);
  gl.uniform1f(vorticityProg.uniforms.dt,dt);
  blit(velocity.write);velocity.swap();
  // divergence
  gl.useProgram(divergenceProg.program);
  gl.uniform2f(divergenceProg.uniforms.texelSize,velocity.texelX,velocity.texelY);
  bindV(divergenceProg.uniforms.uVelocity,velocity.read,0);
  blit(divergence);
  // clear pressure
  gl.useProgram(clearProg.program);
  gl.uniform1i(clearProg.uniforms.uTexture,pressure.read.attach(0));
  gl.uniform1f(clearProg.uniforms.value,PRESSURE);
  blit(pressure.write);pressure.swap();
  // pressure solve
  gl.useProgram(pressureProg.program);
  gl.uniform2f(pressureProg.uniforms.texelSize,velocity.texelX,velocity.texelY);
  gl.uniform1i(pressureProg.uniforms.uDivergence,divergence.attach(0));
  for(var i=0;i<PRESSURE_ITER;i++){
    gl.uniform1i(pressureProg.uniforms.uPressure,pressure.read.attach(1));
    blit(pressure.write);pressure.swap();
  }
  // gradient subtract
  gl.useProgram(gradientProg.program);
  gl.uniform2f(gradientProg.uniforms.texelSize,velocity.texelX,velocity.texelY);
  gl.uniform1i(gradientProg.uniforms.uPressure,pressure.read.attach(0));
  bindV(gradientProg.uniforms.uVelocity,velocity.read,1);
  blit(velocity.write);velocity.swap();
  // advect velocity
  gl.useProgram(advectProg.program);
  gl.uniform2f(advectProg.uniforms.texelSize,velocity.texelX,velocity.texelY);
  bindV(advectProg.uniforms.uVelocity,velocity.read,0);
  gl.uniform1i(advectProg.uniforms.uSource,velocity.read.attach(0));
  gl.uniform1f(advectProg.uniforms.dt,dt);
  gl.uniform1f(advectProg.uniforms.dissipation,VELOCITY_DISSIPATION);
  blit(velocity.write);velocity.swap();
  // advect dye
  gl.uniform2f(advectProg.uniforms.texelSize,velocity.texelX,velocity.texelY);
  bindV(advectProg.uniforms.uVelocity,velocity.read,0);
  gl.uniform1i(advectProg.uniforms.uSource,dye.read.attach(1));
  gl.uniform1f(advectProg.uniforms.dissipation,DENSITY_DISSIPATION);
  blit(dye.write);dye.swap();
}
function render(){
  gl.useProgram(displayProg.program);
  gl.uniform1i(displayProg.uniforms.uTexture,dye.read.attach(0));
  blit(null);
}

/* ---------- スプラット(入力) ---------- */
function correctRadius(r){var a=canvas.width/canvas.height;if(a>1)r*=a;return r;}
function splat(x,y,dx,dy,color){
  gl.useProgram(splatProg.program);
  gl.uniform1i(splatProg.uniforms.uTarget,velocity.read.attach(0));
  gl.uniform1f(splatProg.uniforms.aspectRatio,canvas.width/canvas.height);
  gl.uniform2f(splatProg.uniforms.point,x,y);
  gl.uniform3f(splatProg.uniforms.color,dx,dy,0.0);
  gl.uniform1f(splatProg.uniforms.radius,correctRadius(SPLAT_RADIUS/100.0));
  blit(velocity.write);velocity.swap();
  gl.uniform1i(splatProg.uniforms.uTarget,dye.read.attach(0));
  gl.uniform3f(splatProg.uniforms.color,color.r,color.g,color.b);
  blit(dye.write);dye.swap();
}
function HSVtoRGB(h,s,v){var i=Math.floor(h*6),f=h*6-i,p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s),r,g,b;
  switch(i%6){case 0:r=v;g=t;b=p;break;case 1:r=q;g=v;b=p;break;case 2:r=p;g=v;b=t;break;
  case 3:r=p;g=q;b=v;break;case 4:r=t;g=p;b=v;break;case 5:r=v;g=p;b=q;break;}
  return {r:r,g:g,b:b};}
function genColor(){
  // サイトの世界観: ティール/ゴールド帯を主に、時々差し色。
  var bands=[0.47,0.50,0.53,0.11,0.09,0.13,0.55,0.05,0.83];
  var h=bands[Math.floor(Math.random()*bands.length)]+(Math.random()-0.5)*0.03;
  var c=HSVtoRGB((h+1)%1,0.9,1.0);var k=0.16;
  return {r:c.r*k,g:c.g*k,b:c.b*k};
}

var pointers={};
function posX(e){return e.clientX/canvas.clientWidth;}
function posY(e){return 1.0-e.clientY/canvas.clientHeight;}
function down(e){
  var id=e.pointerId==null?"m":e.pointerId;
  pointers[id]={x:posX(e),y:posY(e),px:posX(e),py:posY(e),color:genColor(),down:true};
  // タップで弾ける: 中心から放射の初速
  var p=pointers[id];splat(p.x,p.y,(Math.random()-0.5)*30,(Math.random()-0.5)*30,p.color);
  hideHint();
}
function move(e){
  var id=e.pointerId==null?"m":e.pointerId;var p=pointers[id];
  if(!p||!p.down)return;
  var events=(e.getCoalescedEvents&&e.getCoalescedEvents().length)?e.getCoalescedEvents():[e];
  for(var i=0;i<events.length;i++){var ev=events[i];
    var nx=posX(ev),ny=posY(ev);
    var dx=(nx-p.x)*SPLAT_FORCE, dy=(ny-p.y)*SPLAT_FORCE;
    splat(nx,ny,dx,dy,p.color);
    p.x=nx;p.y=ny;
  }
  hideHint();
}
function up(e){var id=e.pointerId==null?"m":e.pointerId;if(pointers[id])pointers[id].down=false;}
canvas.addEventListener("pointerdown",down);
canvas.addEventListener("pointermove",move,{passive:true});
addEventListener("pointerup",up);addEventListener("pointercancel",up);

function multiSplat(n){for(var i=0;i<n;i++){var c=genColor();c.r*=8;c.g*=8;c.b*=8;
  var x=Math.random(),y=Math.random();
  var dx=800*(Math.random()-0.5),dy=800*(Math.random()-0.5);
  splat(x,y,dx,dy,c);}}

var hintEl=document.getElementById("hint"),hintGone=false;
function hideHint(){if(!hintGone){hintGone=true;hintEl.classList.add("gone");}}

/* ---------- ループ ---------- */
var last=performance.now();
var idleTimer=0;
function loop(now){
  var dt=Math.min(0.016,(now-last)/1000)||0.016;last=now;
  resize();
  step(dt);
  render();
  // アイドル時は自動で渦が湧いて「生きてる」状態に
  var active=false;for(var k in pointers)if(pointers[k].down)active=true;
  if(!active){idleTimer+=dt;if(idleTimer>3.2){idleTimer=0;multiSplat(1+Math.floor(Math.random()*2));}}
  else idleTimer=0;
  requestAnimationFrame(loop);
}
resize();
multiSplat(7); // 起動時に一発
requestAnimationFrame(loop);

/* ---------- コントロール ---------- */
document.getElementById("burst").addEventListener("click",function(){multiSplat(6);hideHint();
  if(navigator.vibrate)navigator.vibrate(12);});
document.getElementById("reset").addEventListener("click",function(){
  initFBOs();multiSplat(6);});
document.getElementById("save").addEventListener("click",function(){
  try{ // 保存直前に1フレーム描画してからキャプチャ
    render();
    var a=document.createElement("a");a.href=canvas.toDataURL("image/png");a.download="sanbo-uzu.png";a.click();
  }catch(err){alert("保存できませんでした: "+(err.message||err));}
});
</script>
</body></html>
