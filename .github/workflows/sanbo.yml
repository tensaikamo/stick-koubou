name: sanbo
on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:
  # 検証用: workflow_dispatchはデフォルトブランチへの登録前は404になるため、
  # 作業ブランチへのpushでも起動できるようにする(bot自身のdocsコミットでは再発火しない)
  push:
    branches: ["claude/sanbo-qa-launch-csr5tj"]
    paths-ignore: ["docs/**"]

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run sanbo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python sanbo.py
      - name: Commit
        run: |
          git config user.name "sanbo-bot"
          git config user.email "actions@github.com"
          git add docs/
          git commit -m "sanbo update" || echo "no changes"
          git push
