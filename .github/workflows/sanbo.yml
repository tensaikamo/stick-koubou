name: sanbo
on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run sanbo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python sanbo.py
      - name: Commit
        run: |
          git config user.name "sanbo-bot"
          git config user.email "actions@github.com"
          git add docs/
          git commit -m "sanbo update" || echo "no changes"
          git pull --rebase
          git push
      # --- 予測記録層(サイト公開の後・別ステップ・失敗してもサイトは止めない) ---
      - name: Install requests
        run: pip install requests
      - name: Record predictions
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python recorder.py
      - name: Resolve hunches
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python resolver.py
      - name: Commit records
        continue-on-error: true
        run: |
          git config user.name "sanbo-bot"
          git config user.email "actions@github.com"
          git add data/ docs/records.html docs/hunches.html
          git commit -m "record predictions [skip ci]" || echo "no changes"
          git pull --rebase
          git push || (sleep 3 && git pull --rebase && git push)
