name: sanbo
on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

# cron と手動実行が重なると、両者が同じブランチへ push して rebase が衝突し
# 最終コミットで失敗しうる。直列化する(実行中のものは止めない)。
concurrency:
  group: sanbo
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # --- 記録層を先に実行(別ステップ・continue-on-error)。sanbo が当日の hunch を
      #     「追跡中の予測」に同日反映できるようにする。記録が失敗してもサイト生成は止めない。
      - name: Install requests
        run: pip install requests
      - name: Record predictions
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python recorder.py
      - name: Resolve hunches
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 判定先が github.com のとき JSON API を読む(HTMLはJS描画で中身が返らない)。
          # 匿名だと 60req/時(IP単位)で共有IPだと詰まるため、既定トークンで読む。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python resolver.py
      - name: Commit records
        continue-on-error: true
        run: |
          git config user.name "sanbo-bot"
          git config user.email "actions@github.com"
          git add data/ docs/records.html docs/hunches.html docs/threads.html
          git commit -m "record predictions [skip ci]" || echo "no changes"
          git pull --rebase
          git push || (sleep 3 && git pull --rebase && git push)
      # --- サイト生成(記録の後・当日 hunch を読んで公開)。記録の永続とは別コミットで独立 ---
      - name: Run sanbo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python sanbo.py
      # 生成失敗時 sanbo.py は終了コード1で実行を赤くする。その場合でも watch.json など
      # 途中まで得た記録は残したいので always() で必ずコミットへ進む(実行の赤は保たれる)。
      - name: Commit
        if: always()
        run: |
          git config user.name "sanbo-bot"
          git config user.email "actions@github.com"
          git add docs/ data/          # data/watch.json(差分検知のスナップショット)も残す
          git commit -m "sanbo update" || echo "no changes"
          git pull --rebase
          git push || (sleep 3 && git pull --rebase && git push)
